name: Flask checks without institutional data
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
  postgres:
    runs-on: ubuntu-latest
    env:
      DB_HOST: '127.0.0.1'
      DB_PORT: '55432'
      DB_NAME: portfolio_orders_synthetic_ci
      DB_USER: portfolio_demo
      DB_PASSWORD: ${{ format('synthetic-ci-{0}-{1}', github.run_id, github.run_attempt) }}
      RUN_SYNTHETIC_PG_TESTS: '1'
      PYTHON_DOTENV_DISABLED: '1'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portfolio_orders_synthetic_ci
          POSTGRES_USER: portfolio_demo
          POSTGRES_PASSWORD: ${{ format('synthetic-ci-{0}-{1}', github.run_id, github.run_attempt) }}
        ports:
          - '127.0.0.1:55432:5432'
        options: >-
          --health-cmd "pg_isready -U portfolio_demo -d portfolio_orders_synthetic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt
      - name: Prepare synthetic schema and ephemeral session key
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import secrets
          import psycopg2
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as target:
              target.write('SECRET_KEY=' + secrets.token_urlsafe(48) + '\n')
          with psycopg2.connect(host=os.environ['DB_HOST'], port=os.environ['DB_PORT'],
                               dbname=os.environ['DB_NAME'], user=os.environ['DB_USER'],
                               password=os.environ['DB_PASSWORD']) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(Path('database/schema.sql').read_text(encoding='utf-8'))
          PY
      - name: Verify opt-in synthetic PostgreSQL cases
        run: python -m pytest -q tests/test_postgres_integration.py
